name: Browser integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      COMPOSE_FILE: compose.local.yml
      COMPOSE_PROJECT_NAME: vaptx-browser-${{ github.run_id }}-${{ github.run_attempt }}
      VAPTX_API_PORT: "8001"
      VAPTX_WEB_PORT: "3000"
      VAPTX_E2E_EXTERNAL_SERVER: "1"
      VAPTX_MONGO_PORT: "27019"
      VAPTX_INSTALL_AI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Create disposable CI configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/vaptx-browser.env" <<'ENV'
          MONGO_URL=mongodb://mongodb:27017
          DB_NAME=vaptx_ci_browser
          JWT_SECRET=ci-only-synthetic-secret-never-use-outside-tests-123456789
          ADMIN_EMAIL=smoke@example.com
          ADMIN_PASSWORD=ci-only-synthetic-password
          FRONTEND_URL=http://localhost:3000
          INTERNAL_API_URL=http://127.0.0.1:8001
          NMAP_BINARY=nmap
          VAPTX_LOCAL_HTTP=1
          MONGO_TIMEOUT_MS=5000
          ENV
          node -e "process.stdout.write('MFA_ENCRYPTION_KEYS=' + require('crypto').randomBytes(32).toString('base64url') + '=\n')" >> "$RUNNER_TEMP/vaptx-browser.env"
          cp "$RUNNER_TEMP/vaptx-browser.env" backend/.env
      - name: Validate Compose and build API and web images
        run: |
          docker compose --profile web config --quiet
          docker compose --profile web build api web
      - name: Start MongoDB 7, API and web and wait for health checks
        run: docker compose --profile web up --detach --wait --wait-timeout 180
      - name: Verify actual web origin and proxied API readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:3000/ > "$RUNNER_TEMP/vaptx-browser-index.html"
          grep -q '<title>VAPT-X | Security Operations</title>' "$RUNNER_TEMP/vaptx-browser-index.html"
          curl --fail --silent --show-error http://localhost:3000/api/health | jq --exit-status '.status == "ok" and .service == "VAPT-X"'
      - name: Run Chromium integration tests against Nginx web container
        working-directory: tests/e2e
        run: npm test
      - name: Container diagnostics
        if: failure()
        run: |
          docker compose --profile web ps --all
          docker compose --profile web logs --no-color --tail 150
      - name: Preserve Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove containers, network, volumes and temporary configuration
        if: always()
        shell: bash
        run: |
          trap 'rm -f backend/.env "$RUNNER_TEMP/vaptx-browser.env"' EXIT
          if [ -f backend/.env ]; then
            docker compose --profile web down --volumes --remove-orphans --timeout 20
          fi
